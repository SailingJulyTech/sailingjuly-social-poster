name: Comment YouTube links on Reels (manual)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max comments to post this run"
        required: false
        default: "5"
      login_type:
        description: "instagram or facebook (blank = auto)"
        required: false
        default: ""
      dry_run:
        description: "true = only print the match table"
        required: false
        default: "true"

permissions:
  contents: write  # commit content/ig_comment_state.json back

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Comment links
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_FB_ACCESS_TOKEN: ${{ secrets.IG_FB_ACCESS_TOKEN }}
          IG_FB_USER_ID: ${{ secrets.IG_FB_USER_ID }}
          IG_LOGIN_TYPE: ${{ github.event.inputs.login_type || vars.IG_LOGIN_TYPE }}
          LIMIT: ${{ github.event.inputs.limit }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -o pipefail
          args=(--limit "$LIMIT")
          if [ "$DRY_RUN" != "false" ]; then args+=(--dry-run); fi
          python scripts/comment_links.py "${args[@]}" | tee match.txt
      - name: Commit comment state
        if: always() && github.event.inputs.dry_run == 'false'
        run: |
          git config user.name "sailingjuly-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/ig_comment_state.json && git commit -m "Update IG comment state [skip ci]" && git pull --rebase origin main && git push || echo "nothing to commit"
