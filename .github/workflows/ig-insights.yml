name: Pull Instagram insights

# Read-only: pulls Reel + account insights into content/ig_insights.json for the
# shorts-engine to learn from. Posts nothing; the token never leaves the secrets.
on:
  workflow_dispatch:
    inputs:
      login_type:
        description: "instagram or facebook (blank = auto)"
        required: false
        default: "instagram"
  schedule:
    - cron: "17 11 * * 1"   # Mondays 06:17 ET

permissions:
  contents: write  # commit content/ig_insights.json back

concurrency:
  group: ig-insights
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_FB_ACCESS_TOKEN: ${{ secrets.IG_FB_ACCESS_TOKEN }}
          IG_FB_USER_ID: ${{ secrets.IG_FB_USER_ID }}
          IG_LOGIN_TYPE: ${{ github.event.inputs.login_type || 'instagram' }}
        run: python scripts/ig_insights.py
      - name: Commit insights
        run: |
          git config user.name "sailingjuly-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/ig_insights.json && git commit -m "Update IG insights [skip ci]" && git pull --rebase origin main && git push || echo "nothing to commit"
