name: Scheduled social posting

on:
  schedule:
    # Runs every 30 minutes, offset to :07/:37. GitHub Actions cron is UTC and
    # best-effort -- firing exactly on :00/:30 hits peak scheduler congestion
    # (everyone else's cron jobs fire there too), which caused gaps as long as
    # 26 hours in practice. Off-peak minutes are GitHub's own documented
    # mitigation; this doesn't guarantee zero delay, just less of it.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed so the job can commit updated queue.json back

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduler
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          # Facebook-Login flavour. Only these unlock the Audio API
          # (licensed music). When both pairs are set, these win.
          IG_FB_ACCESS_TOKEN: ${{ secrets.IG_FB_ACCESS_TOKEN }}
          IG_FB_USER_ID: ${{ secrets.IG_FB_USER_ID }}
          IG_LOGIN_TYPE: ${{ vars.IG_LOGIN_TYPE }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL }}
        run: python scripts/run_scheduler.py

      - name: Commit updated queue status
        if: always()
        run: |
          git config user.name "sailingjuly-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          # content/scheduler_state.json added 2026-09-05 (run_scheduler.py's
          # same-hour throttle) -- must be committed alongside queue.json or
          # the throttle's "last attempt" marker never persists and every
          # run re-checks against a stale/missing state file.
          if ! git diff --quiet -- content/queue.json content/scheduler_state.json; then
            git add content/queue.json content/scheduler_state.json
            git commit -m "Update queue status [skip ci]"
            # Retry on a rejected push (2026-09-05 fix): an 80-minute run
            # previously lost 100% of its results because an unrelated
            # commit landed on origin/main mid-run and the final `git push`
            # was rejected outright, with nothing to fall back on. Rebase
            # onto whatever landed in the meantime and retry a few times
            # rather than failing the whole job over a push race.
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push rejected (attempt $attempt/5) -- fetching + rebasing and retrying"
              git fetch origin main
              git rebase origin/main
              if [ "$attempt" = 5 ]; then
                echo "::error::push still failing after 5 attempts -- giving up, see log above"
                exit 1
              fi
            done
          else
            echo "No queue changes to commit."
          fi
