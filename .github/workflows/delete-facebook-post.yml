name: Delete Facebook post (manual)

on:
  workflow_dispatch:
    inputs:
      contains:
        description: "Substring to match in the post's description/caption (ignored if check_status is set)"
        required: false
      check_status:
        description: "Read-only: a video_id to check current status for, instead of matching/deleting"
        required: false
      confirm:
        description: "true to actually delete matches; false just lists them"
        required: false
        default: "false"
      keep_earliest:
        description: "true to keep only the earliest match and delete the rest (retry-caused duplicate cleanup)"
        required: false
        default: "false"
      debug_raw:
        description: "true to print raw /videos and /video_reels API responses before matching"
        required: false
        default: "false"

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find/delete matching post
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          CONTAINS: ${{ github.event.inputs.contains }}
          CONFIRM: ${{ github.event.inputs.confirm }}
          KEEP_EARLIEST: ${{ github.event.inputs.keep_earliest }}
          DEBUG_RAW: ${{ github.event.inputs.debug_raw }}
          CHECK_STATUS: ${{ github.event.inputs.check_status }}
        run: |
          if [ -n "$CHECK_STATUS" ]; then
            python scripts/delete_facebook_post.py --check-status "$CHECK_STATUS"
            exit 0
          fi
          args=(--contains "$CONTAINS")
          if [ "$CONFIRM" = "true" ]; then
            args+=(--confirm)
          fi
          if [ "$KEEP_EARLIEST" = "true" ]; then
            args+=(--keep-earliest)
          fi
          if [ "$DEBUG_RAW" = "true" ]; then
            args+=(--debug-raw)
          fi
          python scripts/delete_facebook_post.py "${args[@]}"
